[project]
name = "siteproof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "psycopg[binary,pool]>=3.2,<4", "redis>=5,<7", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4", "playwright>=1.55,<2", "boto3>=1.35,<2", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["services"]
[tool.ruff]
line-length = 120
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["services"]
include = ["siteproof*"]
[tool.ruff.lint.per-file-ignores]
"services/siteproof/capture.py" = ["BLE001"]
"services/siteproof/proxy.py" = ["BLE001", "S110"]
