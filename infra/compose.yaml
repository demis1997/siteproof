name: siteproof
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_USER: siteproof, POSTGRES_PASSWORD: siteproof, POSTGRES_DB: siteproof}
    volumes: ["postgres:/var/lib/postgresql/data", "./001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro"]
    networks: [control]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U siteproof"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis:/data"]
    networks: [control]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: [server, /data, --console-address, ":9001"]
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    volumes: ["objects:/data"]
    networks: [control]
  init:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: [python, -m, siteproof.migrate]
    env_file: ../.env
    networks: [control]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: .., dockerfile: infra/Dockerfile}
    env_file: ../.env
    networks: [control]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, init: {condition: service_completed_successfully}}
  worker:
    build: {context: .., dockerfile: infra/Dockerfile}
    command: [python, -m, siteproof.worker]
    env_file: ../.env
    networks: [control, browser, egress]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}, init: {condition: service_completed_successfully}, browser: {condition: service_started}}
  browser:
    build: {context: .., dockerfile: infra/Dockerfile.browser}
    environment: {SITEPROOF_MODE: "${SITEPROOF_MODE:-fixture}", SITEPROOF_BROWSER_KEY: "${SITEPROOF_BROWSER_KEY:-local-browser-key}", SITEPROOF_TEST_FIXTURE_HTTP: "${SITEPROOF_TEST_FIXTURE_HTTP:-false}"}
    networks: [browser]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 512m
    mem_limit: 1g
    pids_limit: 200
  proxy:
    build: {context: .., dockerfile: infra/Dockerfile}
    environment: {SITEPROOF_MODE: "${SITEPROOF_MODE:-fixture}", SITEPROOF_TEST_FIXTURE_HTTP: "${SITEPROOF_TEST_FIXTURE_HTTP:-false}"}
    command: [python, -m, siteproof.proxy]
    networks: [browser, egress]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  fixture:
    profiles: [integration]
    build: {context: .., dockerfile: infra/Dockerfile}
    command: [python, -m, siteproof.fixture_server]
    networks: [browser]
    read_only: true
    cap_drop: [ALL]
  web:
    build: {context: .., dockerfile: apps/web/Dockerfile}
    environment: {SITEPROOF_RENDER_KEY: "${SITEPROOF_RENDER_KEY:-local-render-key}", API_INTERNAL_URL: "http://api:8000", SITEPROOF_TENANT_KEY: "${SITEPROOF_TENANT_KEY:-local-development-key}"}
    networks: [control]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
networks:
  control: {internal: true}
  browser: {internal: true}
  egress: {}
volumes:
  postgres: {}
  redis: {}
  objects: {}
