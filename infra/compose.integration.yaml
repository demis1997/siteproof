# Use only with an isolated project name. No live credentials or production URL exceptions.
services:
  init:
    environment: &integration
      SITEPROOF_MODE: fixture
      SITEPROOF_MODEL_KEY: ''
      SITEPROOF_EMBEDDING_KEY: ''
      SITEPROOF_EMBEDDING_USE_MODEL_CREDENTIALS: 'false'
      SITEPROOF_RERANK_URL: ''
      SITEPROOF_TEST_FIXTURE_HTTP: 'true'
      SITEPROOF_TENANT_KEYS_JSON: '{"integration":"integration-key","other":"other-key"}'
  api:
    environment: *integration
  worker:
    environment: *integration
  browser:
    environment:
      SITEPROOF_MODE: fixture
      SITEPROOF_TEST_FIXTURE_HTTP: 'true'
  proxy:
    environment:
      SITEPROOF_MODE: fixture
      SITEPROOF_TEST_FIXTURE_HTTP: 'true'
  ui-test:
    profiles: [ui-test]
    image: siteproof-integration-browser
    init: true
    networks: [control, egress]
    shm_size: 512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, evals/ui_run.py]
